meta:
  name:
    short: THWS
    full: Technische Hochschule Würzburg-Schweinfurt
  link:
    home: https://www.thws.de

logo:
  images:
    horizontal: _extensions/moodle/logo_en.svg
  medium: horizontal

color:
  palette:
    thws-orange: "#ff6a00"
    thws-teal:   "#005564"
    thws-dark:   "#343a40"
    thws-red:    "#c4515b"
    white:       "#ffffff"

  foreground: thws-dark
  background: white
  primary:    thws-orange
  secondary:  thws-teal
  success:    thws-teal
  info:       thws-orange
  warning:    thws-red
  danger:     thws-red

typography:
  fonts:
    - family: Inter
      source: google
      weight: [300, 400, 500, 600, 700]
      style: [normal, italic]

  base:
    family: Inter
    weight: 400
    size: 16px
    line-height: 1.5

  headings:
    family: Inter
    weight: 700
    color: thws-orange

  link:
    color: thws-orange
    decoration: none
